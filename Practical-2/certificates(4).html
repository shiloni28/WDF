<!DOCTYPE html>
<html>
<head>
    <title>Certificates</title>
</head>
<body>
<p>
<a href="studentdashboard(2).html"> Back to Student Dashboard</a>
</p>
<center>
<h1>CERTIFICATES</h1>
</center>
<fieldset>
<legend><b>CERTIFICATE DETAILS</b></legend>
<p>
<label>Certificate Name :</label><br>
<input type="text" size="45">
</p>
<p>
<label>Category :</label><br>
<input type="radio" name="category"> Tech
<input type="radio" name="category"> Non-Tech
<input type="radio" name="category"> Workshop
<input type="radio" name="category"> Seminar
</p>

<p>
<label>Name of Event / Course :</label><br>
<input type="text" size="50">
</p>

<p>
<label>Event Organized By :</label><br>
<input type="text" size="50">
</p>

<p>
<label>Status :</label><br>
<input type="radio" name="status"> Approved
<input type="radio" name="status"> Rejected
<input type="radio" name="status"> Pending
</p>
<p>
<label>Date of Completion :</label><br>
<input type="date">
</p>
<p>
<label>Certificate Description :</label><br>
<textarea rows="4" cols="60"></textarea>
</p>
<p>
<label>Upload Certificate :</label><br>
<input type="file">
</p>
</fieldset>
<br>
<center>
<input type="submit" value="Submit">
<input type="reset" value="Clear">
</center>
<hr>
</body>
</html>
