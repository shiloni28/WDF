<!DOCTYPE html>
<html>
<head>
    <title>Leave Application</title>
</head>
<body>
<p>
<a href="studentdashboard(2).html">Back to Student Dashboard</a>
</p>
<center>
<h1>LEAVE APPLICATION</h1>
<h3>Apply for Leave</h3>
</center>
<fieldset>
<legend><b>LEAVE DETAILS</b></legend>
<p>
<label><b>Type of Leave :</b></label><br><br>
<select>
<option>Select Leave Type</option>
<option>Home Leave</option>
<option>Medical Leave</option>
<option>Other</option>
</select>
</p>

<p>
<label><b>Reason for Leave :</b></label><br><br>
<textarea rows="4" cols="60" placeholder="Enter reason for leave"></textarea>
</p>
<table cellpadding="10">
<tr>
<td>
<label><b>From Date :</b></label><br><br>
<textarea rows="1" cols="18" placeholder="DD/MM/YYYY"></textarea>
</td>
<td>
<label><b>To Date :</b></label><br><br>
<textarea rows="1" cols="18" placeholder="DD/MM/YYYY"></textarea>
</td>
</tr>
</table>
<p>
<label><b>Medical Certificate (If Applicable) :</b></label><br><br>
<input type="file">
</p>
<p>
<label><b>Additional Remarks :</b></label><br><br>
<textarea rows="3" cols="60" placeholder="Enter remarks (optional)"></textarea>
</p>
</fieldset>
<br>
<center>
<input type="submit" value="Apply Leave">
</center>
</body>
</html>
